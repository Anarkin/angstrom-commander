name: Deploy to test

# Deploys main to the test stamp, but only after the CI gates pass — a red main stays
# on people's machines, it does not ship. workflow_run fires on every CI completion whose
# head branch is merely *named* main, and a fork's pull request can come from a branch
# named main: without the job guard, a stranger's PR would run azd here, on its own code,
# with this repo's Azure identity. The guard admits only green pushes to this repo.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Secretless: the workflow's own GitHub-issued OIDC token is exchanged for Azure access
# via the msi-angstrom-commander federated identity (created by `azd pipeline config`).
# No cloud credential is stored in this repository.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      # Terraform (run by azd provision) authenticates with the same federated identity.
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: "true"
    steps:
      # The commit whose CI went green, not whatever main points at now. Without the ref,
      # checkout takes the branch's current HEAD: push B landing while A's CI is still running
      # means A's success triggers a deploy of B, ungated. Empty on workflow_dispatch, where
      # checkout's default (the dispatched ref) is what is wanted.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: Azure/setup-azd@v2

      # azd shells out to terraform; the wrapper's output capture confuses it.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Log in with Azure (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision infrastructure
        run: azd provision --no-prompt

      - name: Deploy services
        run: azd deploy --no-prompt
