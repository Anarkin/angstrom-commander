name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test with coverage
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"

      # The OpenAPI contract is a build output; the build above regenerated it.
      - name: Verify the committed OpenAPI contract is current
        run: git diff --exit-code -- openapi/

  webclient:
    name: WebClient lint, format, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebClient
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/WebClient/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify the generated API types match the contract
        run: npm run gen:api:check

      - name: Lint (type-aware, warnings are errors)
        run: npm run lint

      - name: Verify formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3

      - name: Verify formatting
        run: terraform fmt -check -recursive

      # -backend=false: validation needs providers, not state — CI has no Azure
      # credentials and must not need any.
      - name: Validate the stamp module
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate the shared module
        working-directory: infra/shared
        run: |
          terraform init -backend=false
          terraform validate

  compose:
    name: Images build and the stack comes up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `docker compose up` is the setup guide's headline command, so it is worth a gate:
      # nothing else in CI touches the Dockerfiles or the wiring between the containers.
      - name: Build the images
        run: docker compose build

      - name: Start the stack
        run: docker compose up --detach --wait

      - name: The Daemon reaches the Server and offers a pairing code
        run: |
          for _ in $(seq 1 30); do
            if docker compose logs daemon | grep -q "PAIRING CODE"; then
              echo "The Daemon enrolled and is waiting to be paired."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The Daemon never printed a pairing code."
          docker compose logs
          exit 1

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
