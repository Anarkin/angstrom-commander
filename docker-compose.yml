services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: angstrom
      POSTGRES_PASSWORD: angstrom
      POSTGRES_DB: angstrom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angstrom"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: src/Server/Dockerfile
    ports:
      - "5080:8080"
    environment:
      # The compose stack IS the dev environment (enables CORS for local dev pages).
      ASPNETCORE_ENVIRONMENT: "Development"
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=angstrom;Username=angstrom;Password=angstrom"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The aspnet base image has no curl; bash /dev/tcp works for a listen check.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 3s
      timeout: 3s
      retries: 10

  webclient:
    build:
      context: .
      dockerfile: src/WebClient/Dockerfile
      args:
        # The browser talks to the Server directly, so this is the host-visible URL.
        VITE_SERVER_URL: "http://localhost:5080"
    ports:
      - "5081:8080"
    depends_on:
      - server

  daemon:
    build:
      context: .
      dockerfile: src/Daemon/Dockerfile
    environment:
      Relay__ServerUrl: "http://server:8080"
      Relay__StateDirectory: "/state"
      # The repo, shared read-only.
      Relay__AllowedRoots__0__Path: "/data"
      Relay__AllowedRoots__0__Writable: "false"
      # A writable share, so uploads and machine-to-machine copies have somewhere to land.
      Relay__AllowedRoots__1__Path: "/uploads"
      Relay__AllowedRoots__1__Writable: "true"
      # The container's whole filesystem — a dev-only "share everything" example, read-only.
      Relay__AllowedRoots__2__Path: "/"
      Relay__AllowedRoots__2__Writable: "false"
    volumes:
      # Sample sandboxed directory: the repo itself, read-only.
      - ./:/data:ro
      # Machine identity (keypair + registration) survives restarts.
      - daemon-state:/state
      # Somewhere writable to receive uploads and copies.
      - daemon-uploads:/uploads
    depends_on:
      server:
        condition: service_healthy

volumes:
  daemon-state:
  daemon-uploads:
