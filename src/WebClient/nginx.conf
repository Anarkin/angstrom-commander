server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx drops inherited add_header directives as soon as a block declares one of its own,
    # so the security headers are repeated in every location rather than set once here.

    # Hashed asset file names are safe to cache hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # No Content-Security-Policy here on purpose: it has to name the Server's origin, which is a
    # build-time variable, and this image only serves the compose setup. The CSP belongs with the
    # Static Web Apps configuration that serves the bundle in real environments.
}
