server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset file names are safe to cache hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
